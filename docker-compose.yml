version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yourcareerbuddy-postgres
    environment:
      POSTGRES_USER: yourcareer
      POSTGRES_PASSWORD: yourcareer
      POSTGRES_DB: yourcareerbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourcareerbuddy-backend
    environment:
      DATABASE_URL: postgresql://yourcareer:yourcareer@postgres:5432/yourcareerbuddy
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yourcareerbuddy-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
